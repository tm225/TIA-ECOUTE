name: Build TIA ECOUTE (APK)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Préparer les sources (dossier ou fichier .zip)
        run: |
          if [ -f settings.gradle.kts ]; then
            echo "PROJECT_DIR=." >> "$GITHUB_ENV"
          else
            ZIP=$(ls *.zip 2>/dev/null | head -n1)
            if [ -z "$ZIP" ]; then echo "Aucun projet trouvé (ni settings.gradle.kts, ni .zip)"; exit 1; fi
            mkdir -p _src && unzip -q -o "$ZIP" -d _src
            DIR=$(dirname "$(find _src -name settings.gradle.kts | head -n1)")
            echo "PROJECT_DIR=$DIR" >> "$GITHUB_ENV"
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Préparer le SDK Android (déjà installé sur le runner)
        run: |
          export SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKM" ] || SDKM=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -n1)
          yes | "$SDKM" --licenses > /dev/null 2>&1 || true
          "$SDKM" "platforms;android-35" "build-tools;35.0.0" > /dev/null 2>&1 || true
          echo "sdk.dir=$ANDROID_HOME" > "$PROJECT_DIR/local.properties"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compiler l'APK debug
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon --console=plain 2>&1 | tee "$GITHUB_WORKSPACE/build_debug.log"

      - name: Résumé des erreurs (si échec)
        if: failure()
        run: |
          {
            echo "## Erreurs de compilation"
            echo '```'
            grep -E "^e: |What went wrong|error:|Execution failed" -A2 "$GITHUB_WORKSPACE/build_debug.log" | head -80
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          grep -E "^e: " "$GITHUB_WORKSPACE/build_debug.log" | head -20 | while read -r l; do echo "::error::$l"; done

      - name: Compiler l'APK release (optimisé)
        continue-on-error: true
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Rassembler les APK
        run: |
          mkdir -p out
          cp "$PROJECT_DIR"/app/build/outputs/apk/debug/*.apk out/TIA-ECOUTE-debug.apk
          cp "$PROJECT_DIR"/app/build/outputs/apk/release/*.apk out/TIA-ECOUTE.apk || true
          ls -lh out

      - uses: actions/upload-artifact@v4
        with:
          name: TIA-ECOUTE-apk
          path: out/*.apk

      - name: Publier une release téléchargeable
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: TIA ECOUTE – build ${{ github.run_number }}
          files: out/*.apk
